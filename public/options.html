<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页翻译 · API 设置</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div class="eyebrow">PAGE TRANSLATOR</div><h1>用你选择的模型，读懂网页。</h1><p>设置一次，在网页上点击扩展即可翻译。没有额外的中转服务器。</p></header>
<form class="panel"><label>API 类型<select name="provider"><option value="responses">OpenAI 兼容 · Responses</option><option value="chat">OpenAI 兼容 · Chat Completions</option><option value="anthropic">Anthropic 原生 · Messages</option></select></label>
<label>API Base URL<input name="baseUrl" type="url" placeholder="https://your-api.example.com" required spellcheck="false"><small>填写接口前缀，不含 /responses 或 /chat/completions。不会自动补 /v1；若服务要求，请自行填入。</small></label>
<label>模型<input name="model" value="translate" required maxlength="160" spellcheck="false"></label>
<label>API Key<input name="apiKey" type="password" autocomplete="off" spellcheck="false"><small>只保存在本机扩展存储中；已保存时留空保留，不回显 Key。切换来源或协议须重新填写。</small></label>
<label>目标语言<input name="targetLanguage" value="简体中文" required maxlength="80"></label>
<div class="actions"><button type="submit" class="primary">保存并授权 API</button><button type="button" id="test">测试已保存配置</button><button type="button" class="danger" id="clear">清除配置</button></div>
<p id="status" role="status" aria-live="polite"></p></form>
<div class="notice">隐私提示：只有手动开始翻译时才发送网页文本。文本会交给你配置的 API，可能产生费用；不要翻译不允许外发的内容。Key 不会交给网页脚本，但本机扩展存储并非加密保险箱。</div>
<p class="footnote">首版支持普通 HTML 主文档。不处理 PDF、图片、iframe、Shadow DOM、编辑区和代码。不会自动重试或切换模型。</p></main><script src="options.js" type="module"></script></body></html>
