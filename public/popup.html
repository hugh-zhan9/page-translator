<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页翻译</title><link rel="stylesheet" href="styles.css"></head><body class="popup"><main>
<header><div class="eyebrow">PAGE TRANSLATOR</div><h1>读懂眼前这一页。</h1><p>用自己的 API，保留原来的网页。</p></header>
<label>显示方式<select id="mode"><option value="bilingual">双语对照</option><option value="translated">仅显示译文</option></select></label>
<div class="actions"><button id="start" class="primary">翻译当前页</button><button id="restore">恢复原文</button></div>
<button id="site" class="text-button" disabled>正在读取悬浮按钮设置…</button>
<p id="status" role="status" aria-live="polite">点击「翻译当前页」开始。</p><button class="text-button" id="settings">API 设置 →</button>
<p class="footnote">翻译会将网页文本发送到你配置的 API。会话中新增的内容也会翻译；恢复原文后停止。</p>
</main><script src="popup.js" type="module"></script></body></html>
